name: Security Pipeline

on:
  push:
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit semgrep pip-audit pytest

    - name: Run tests
      run: |
        python -m pytest -v --tb=short

    - name: Run Bandit (SAST)
      run: |
        python -m bandit -r app/ -f json -o reports/bandit-report.json || true
      continue-on-error: true

    - name: Run Semgrep (SAST)
      run: |
        semgrep scan --config security/semgrep/rules.yml --json --output reports/semgrep-report.json || true
      continue-on-error: true

    - name: Run pip-audit (SCA)
      run: |
        python -m pip_audit --format json --output reports/pip-audit-report.json || true
      continue-on-error: true

    - name: Build Docker image
      run: |
        docker build -t vulnfinbot:latest .

    - name: Run Trivy (Container Scan)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'vulnfinbot:latest'
        format: 'json'
        output: 'reports/trivy-report.json'
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: reports/
        retention-days: 30
